*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#0d1b2a;font-family:'Nunito',sans-serif;color:#fff;min-height:100vh;overflow-x:hidden;}
.screen{min-height:100vh;padding:20px 16px 80px;}
.hidden{display:none!important;}
.home{display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#0d1b2a,#1b2838,#0a1628);}
.logo-emoji{font-size:72px;margin-bottom:8px;animation:float 3s ease-in-out infinite;}

.code-input::placeholder{letter-spacing:1px;font-size:14px;font-family:'Nunito',sans-serif;}
.btn{width:100%;border:none;border-radius:14px;padding:16px;font-family:'Fredoka One',cursive;font-size:18px;color:#fff;cursor:pointer;-webkit-appearance:none;touch-action:manipulation;}

.btn-red{background:linear-gradient(135deg,#e63946,#c1121f);}
.btn-teal{background:linear-gradient(135deg,#2a9d8f,#1a7a6a);}
.btn-blue{background:linear-gradient(135deg,#457b9d,#2d5a7a);}
.btn-gold{background:linear-gradient(135deg,#e9c46a,#c9a030);color:#1a1a2a!important;}
.btn-ghost{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.6);}
.btn-row{display:flex;gap:10px;}
.btn-row .btn{flex:1;}
.form-group{display:flex;flex-direction:column;gap:12px;width:100%;max-width:400px;}
.status-box{font-size:12px;text-align:center;padding:8px 14px;border-radius:10px;margin-bottom:4px;}
.s-ok{background:rgba(42,157,143,0.2);color:#2a9d8f;border:1px solid rgba(42,157,143,0.3);}
.s-wait{background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.4);}
.s-err{background:rgba(230,57,70,0.2);color:#e63946;border:1px solid rgba(230,57,70,0.3);}
.lobby{display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#0d1b2a,#1b2838);}
.room-code-display{background:rgba(255,209,102,0.1);border:2px dashed #ffd166;border-radius:14px;padding:12px 32px;display:inline-block;margin-bottom:8px;}
.room-code-value{font-family:'Fredoka One',cursive;font-size:44px;color:#ffd166;letter-spacing:12px;}
.player-row{display:flex;align-items:center;gap:12px;border-radius:12px;padding:12px 16px;margin-bottom:8px;width:100%;max-width:400px;}
.player-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.player-name-lbl{flex:1;font-weight:700;}
.badge{font-size:11px;padding:2px 8px;border-radius:6px;}
.badge-host{background:rgba(255,209,102,0.2);color:#ffd166;}
.badge-you{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.5);}
.game{background:linear-gradient(160deg,#0d1b2a,#1b2838,#0a1628);}
.mission-card{border-radius:16px;padding:12px 16px;margin-bottom:14px;}
.mn{background:rgba(42,157,143,0.12);border:1px solid rgba(42,157,143,0.4);}
.mx{background:rgba(230,57,70,0.12);border:1px solid rgba(230,57,70,0.4);}
.xbadge{font-size:10px;background:#e63946;color:#fff;border-radius:4px;padding:2px 6px;font-weight:800;margin-right:6px;}
.mtitle{font-family:'Fredoka One',cursive;font-size:16px;}
.mdesc{font-size:12px;color:rgba(255,255,255,0.6);line-height:1.5;margin-top:4px;}
.pbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
.pchip{border-radius:12px;padding:8px 12px;min-width:84px;flex-shrink:0;}
.pcname{font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:76px;margin-bottom:4px;}
.pcinfo{font-size:10px;color:rgba(255,255,255,0.5);margin-top:3px;}
.ptk{display:flex;gap:3px;flex-wrap:wrap;}
.pd{width:12px;height:12px;border-radius:50%;}

.pd.off{background:rgba(255,255,255,0.1);border:1.5px solid rgba(255,255,255,0.2);}
.trick-area{background:rgba(255,255,255,0.04);border-radius:16px;padding:14px;margin-bottom:14px;}
.tlbl{font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:10px;}
.tcards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;min-height:70px;align-items:center;}
.tcw{text-align:center;}
.tcpn{font-size:10px;color:rgba(255,255,255,0.5);margin-top:4px;}
.hand-area{margin-bottom:16px;}
.hlbl{font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:10px;}
.hcards{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.card{border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;user-select:none;flex-shrink:0;touch-action:manipulation;}
.card.sel{transform:translateY(-10px);box-shadow:0 0 12px #ffd166!important;}
.cv{font-family:'Fredoka One',cursive;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,0.5);}
.csb{position:absolute;top:-7px;left:50%;transform:translateX(-50%);background:#ffd166;border-radius:4px;padding:1px 5px;font-size:9px;color:#1a1a2a;font-weight:900;}
.bpanel{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(to top,#0d1b2a 85%,transparent);padding:16px 20px 30px;border-top:1px solid rgba(255,255,255,0.1);z-index:50;}
.brow{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:12px;}
.bbtn{background:rgba(255,255,255,0.12);border:none;border-radius:10px;width:50px;height:50px;color:#fff;font-size:28px;cursor:pointer;touch-action:manipulation;}
.bval{font-family:'Fredoka One',cursive;font-size:52px;color:#ffd166;min-width:56px;text-align:center;}
.binfo{font-size:13px;color:rgba(255,255,255,0.6);text-align:center;margin-bottom:10px;}
.wmsg{text-align:center;color:rgba(255,255,255,0.5);font-size:14px;padding:10px 0;}
.tbox{text-align:center;margin-bottom:16px;}
.tnum{font-family:'Fredoka One',cursive;font-size:80px;line-height:1;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:100;}
.modal{background:#1b2838;border-radius:20px;padding:24px;width:90%;max-width:320px;text-align:center;}
.modal-title{font-family:'Fredoka One',cursive;font-size:22px;color:#ffd166;margin-bottom:16px;}
.mrow{display:flex;gap:10px;margin-top:16px;}
.results{background:linear-gradient(160deg,#0d1b2a,#1b2838);}
.rrow{border-radius:14px;padding:14px 18px;margin-bottom:10px;}
.rname{font-family:'Fredoka One',cursive;font-size:18px;}

.rwarn{text-align:center;color:#ff6b6b;font-size:11px;margin-top:6px;}
input[type=range]{width:100%;accent-color:#ffd166;}

      <div>
        <div style="font-family:'Fredoka One',cursive;font-size:22px;color:#ffd166">🌶️ Pili Pili</div>
        <div id="gplbl" style="font-size:11px;color:rgba(255,255,255,0.4)"></div>
      </div>
    </div>
    <div style="text-align:right">
      <div style="font-size:10px;color:rgba(255,255,255,0.5)">Vous</div>
      <div id="gmyname" style="font-family:'Fredoka One',cursive;font-size:16px"></div>
      <div id="gmypili" class="ptk" style="justify-content:flex-end"></div>

  </div>

</div>

</div>

// UTILITAIRES

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function setStatus(type,msg){var e=document.getElementById('fb-status');if(e){e.className='status-box s-'+type;e.textContent=msg;}}
function toast(msg,ms){
  ms=ms||3000;var t=document.getElementById('toastbox');
  t.textContent=msg;t.classList.remove('hidden');
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.add('hidden');},ms);
}
function scr(name){
  ['home','lobby','game','results'].forEach(function(s){
    document.getElementById('screen-'+s).classList.toggle('hidden',s!==name);
  });
}
function ptk(n,max){max=max||6;var h='';for(var i=0;i<max;i++)h+='<div class="pd '+(i<n?'on':'off')+'"></div>';return h;}
function cardCol(n){
  if(!n)return{bg:'#1a1a2e',br:'#ff6b35'};
  var st=[{a:1,b:'#1a2a6c'},{a:8,b:'#2a4a8c'},{a:14,b:'#3a7ab5'},{a:20,b:'#4a8a7a'},{a:25,b:'#5a8a4a'},{a:30,b:'#7a9a2a'},{a:35,b:'#a8a020'},{a:40,b:'#c88018'},{a:45,b:'#c85020'},{a:50,b:'#b03030'},{a:55,b:'#6b2010'}];
  var lo=st[0],hi=st[st.length-1];
  for(var i=0;i<st.length-1;i++){if(n>=st[i].a&&n<=st[i+1].a){lo=st[i];hi=st[i+1];break;}}
  var t=(n-lo.a)/Math.max(hi.a-lo.a,1);
  function lp(a,b){return Math.round(a+(b-a)*t);}
  function hx(v){return v.toString(16).padStart(2,'0');}
  function pr(c){return[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
  var a=pr(lo.b),b=pr(hi.b);
  return{bg:'#'+hx(lp(a[0],b[0]))+hx(lp(a[1],b[1]))+hx(lp(a[2],b[2])),br:'rgba(255,255,255,0.25)'};
}
function mkCard(c,o){
  o=o||{};var hid=o.hid,sel=o.sel,oc=o.oc,sm=o.sm;
  var w=sm?44:64,h=sm?62:90,fs=sm?15:25;
  var col=cardCol(c.j?0:c.v);
  var bg=hid?'linear-gradient(135deg,#1a2a4a,#0d1b2a)':col.bg;
  var br=sel?'#ffd166':(hid?'rgba(255,255,255,0.1)':col.br);
  var sh=sel?'0 0 12px #ffd166':'0 3px 8px rgba(0,0,0,0.4)';
  var tr=sel?'translateY(-10px)':'none';
  var ct=hid?'<span style="font-size:14px;opacity:0.2">🌶️</span>':c.j?'<span style="font-size:'+fs+'px">🔥</span>':'<span class="cv" style="font-size:'+fs+'px">'+c.v+'</span>';
  var bd=sel?'<div class="csb">✓</div>':'';
  var ca=oc?'onclick="'+oc+'"':'';
  return'<div class="card'+(sel?' sel':'')+'" style="width:'+w+'px;height:'+h+'px;background:'+bg+';border:2px solid '+br+';box-shadow:'+sh+';transform:'+tr+';" '+ca+'>'+ct+bd+'</div>';
}
function mkDeck(){var d=[];for(var i=1;i<=55;i++)d.push({id:i,v:i,j:false});d.push({id:56,v:56,j:true});return d;}
function rnd(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}return r;}
function ev(c,rev){if(!c)return 0;if(c.j)return rev?-1:57;return rev?56-c.v:c.v;}
function spl(gs){return Object.values(gs.players||{}).sort(function(a,b){return(a.o||0)-(b.o||0);});}
function gh(p){if(!p||!p.hand)return[];if(p.hand._x)return[];return Array.isArray(p.hand)?p.hand:Object.values(p.hand).filter(function(x){return x&&!x._x;});}
function clnT(o){if(!o)return{};var r={};Object.keys(o).forEach(function(k){if(k!=='_x')r[k]=o[k];});return r;}
function exchSelN(e){if(e==='exch1r'||e==='exch1l')return 1;if(e==='exch3r'||e==='exch3l')return 3;return 2;}
function genCode(){return Math.random().toString(36).substr(2,4).toUpperCase();}
function genSolo(){return'SL'+Math.random().toString(36).substr(2,2).toUpperCase();}
function getName(){return document.getElementById('home-name').value.trim();}
function initPh(m){if(m.e==='t3s'||m.e==='t5sblind')return'timer';if(m.e==='3of5')return'sel3of5';if(m.e==='betblind')return'betblind';return'betting';}
function postBet(m){
  if(m.e==='desig')return'desig';
  if(m.e==='betblind')return'reveal';
  // Missions à sélection : le joueur choisit ses cartes avant l'échange
  var selEffects=['exch2r','exch2l','exch1r','exch1l','exch3r','exch3l'];
  if(selEffects.indexOf(m.e)>=0)return'exchsel';
  return'playing';
}

function doSolo(){
  if(!DB){toast('⚠️ Firebase pas prêt — patientez 2 secondes et réessayez');return;}
  var name=getName();if(!name){toast('✏️ Entrez votre prénom !');return;}
  var code=genSolo();ROOM=code;HOST=true;
  setStatus('wait','Lancement...');
  startGame(code,PID,[
    {id:PID,name:name,isAI:false,pilis:0,o:0},
    {id:'ai1',name:'Robo-Chili 🤖',isAI:true,pilis:0,o:1},
    {id:'ai2',name:'Capsaïco 🤖',isAI:true,pilis:0,o:2}
  ]).then(function(){subRoom(code);})
  .catch(function(e){toast('Erreur: '+e.message);setStatus('err','❌ '+e.message);console.error(e);});
}

function doCreate(){
  if(!DB){toast('⚠️ Firebase pas prêt');return;}
  var name=getName();if(!name){toast('✏️ Entrez votre prénom !');return;}
  var code=genCode();
  DB.ref('rooms/'+code).set({code:code,phase:'lobby',hostId:PID,
    players:{[PID]:{id:PID,name:name,isAI:false,pilis:0,o:0}},ts:Date.now()})
  .then(function(){ROOM=code;HOST=true;subRoom(code);scr('lobby');})
  .catch(function(e){toast('Erreur: '+e.message);});
}

function doJoin(){
  if(!DB){toast('⚠️ Firebase pas prêt');return;}
  var name=getName();var code=document.getElementById('join-code').value.trim().toUpperCase();
  if(!name){toast('✏️ Entrez votre prénom !');return;}
  if(code.length<3){toast('⚠️ Code invalide');return;}
  DB.ref('rooms/'+code).get()
  .then(function(s){
    var room=s.val();
    if(!room){toast('❌ Salle introuvable');return;}
    if(room.phase!=='lobby'){toast('⚠️ Partie déjà commencée');return;}
    var nb=Object.keys(room.players||{}).length;
    if(nb>=8){toast('⚠️ Salle pleine');return;}
    return DB.ref('rooms/'+code+'/players/'+PID)
      .set({id:PID,name:name,isAI:false,pilis:0,o:nb})
      .then(function(){ROOM=code;HOST=false;subRoom(code);scr('lobby');});
  })
  .catch(function(e){toast('Erreur: '+e.message);});
}

function doMatchmaking(){
  if(!DB){toast('⚠️ Firebase pas prêt');return;}
  var name=getName();if(!name){toast('✏️ Entrez votre prénom !');return;}
  DB.ref('rooms').get()
  .then(function(s){
    var rooms=s.val()||{};
    // ANO-022+023: exclure les salles où ce joueur est déjà dedans
    var open=Object.values(rooms).find(function(r){
      var players=r.players||{};
      var alreadyIn=Object.keys(players).indexOf(PID)>=0;
      return r.phase==='lobby'&&Object.keys(players).length<8&&!(r.code||'').startsWith('SL')&&!alreadyIn;
    });
    if(open){document.getElementById('join-code').value=open.code;doJoin();}
    else doCreate();
  })
  .catch(function(e){toast('Erreur matchmaking: '+e.message);});
}

function doLeave(){
  if(ROOM&&DB)DB.ref('rooms/'+ROOM+'/players/'+PID).remove().catch(function(){});
  if(LSTNR&&DB){DB.ref('rooms/'+LSTNR).off('value');LSTNR=null;}
  ROOM=null;HOST=false;GS=null;SEL=[];scr('home');
}

// ════════════════════════════════════════════════════
// SUBSCRIPTION
// ════════════════════════════════════════════════════
function subRoom(code){
  if(LSTNR&&DB){DB.ref('rooms/'+LSTNR).off('value');LSTNR=null;}
  LSTNR=code;
  DB.ref('rooms/'+code).on('value',function(s){
    var data=s.val();
    if(!data){ROOM=null;scr('home');toast('Salle fermée.');return;}
    GS=data;
    if(data.phase==='lobby')rndrLobby(data);
    else if(data.phase==='results')rndrResults(data);
    else rndrGame(data);
    if(HOST&&data.cp&&!BUSY){
      var cp=data.players[data.cp];
      if(cp&&cp.isAI){
        console.log('[AI] Trigger for',cp.name,'phase:',data.phase,'BUSY:',BUSY);
        clearTimeout(window._ait);
        BUSY=false;
        window._ait=setTimeout(function(){
          console.log('[AI] Executing turn for',cp.name,'BUSY:',BUSY);
          BUSY=false;
          aiTurn(data,data.cp);
        },600+Math.floor(Math.random()*300));
      }
    }
    // exchsel : déclencher l'IA pour le premier joueur IA sans sélection
    if(HOST&&data.phase==='exchsel'&&!BUSY){
      var firstUnsub=Object.values(data.players).find(function(p){return p.isAI&&!p.exchCards;});
      if(firstUnsub){
        clearTimeout(window._ait);
        BUSY=false;
        window._ait=setTimeout(function(){
          BUSY=false;
          aiTurn(data,firstUnsub.id);
        },600+Math.floor(Math.random()*300));
      }
    }
    if(data.phase==='timer'&&data.timerEnd){
      // EVO-002: show reveal button, then auto-start timer on click
      var timerDiv=document.getElementById('gtimer');
      timerDiv.classList.remove('hidden');
      timerDiv.innerHTML='<div style="text-align:center;padding:10px">'+
        '<div style="color:rgba(255,255,255,0.6);font-size:14px;margin-bottom:12px">🃏 Vos cartes sont cachées</div>'+
        '<button id="btn-reveal-cards" class="btn btn-teal" style="max-width:280px;margin:0 auto" type="button">👁 Révéler mes cartes ('+
        (data.m.e==='t3s'?'3':'5')+'s)</button></div>';
      var brc=document.getElementById('btn-reveal-cards');
      if(brc){
        function doRevealTimer(){
          brc.disabled=true;
          window.TMRREV=true;
          if(GS)rndrGame(GS);
          startTmr(Date.now()+(data.m.e==='t3s'?3000:5000),function(){
            window.TMRREV=false;
            if(HOST){var pl=spl(data);DB.ref('rooms/'+code).update({phase:'betting',cp:pl[data.dealer%pl.length].id});}
          });
        }
        brc.addEventListener('click',doRevealTimer);
        brc.addEventListener('touchend',function(e){e.preventDefault();doRevealTimer();},false);
      }
    }
  });
}

function rndrLobby(gs){
  scr('lobby');
  document.getElementById('lobby-code').textContent=gs.code;
  var players=Object.values(gs.players||{}).sort(function(a,b){return(a.o||0)-(b.o||0);});
  document.getElementById('lobby-players').innerHTML=players.map(function(p,i){
    return'<div class="player-row" style="background:'+PC[i%PC.length]+'18;border:1px solid '+PC[i%PC.length]+'44">'+
      '<div class="player-dot" style="background:'+PC[i%PC.length]+'"></div>'+
      '<div class="player-name-lbl">'+esc(p.name)+'</div>'+
      (p.id===gs.hostId?'<span class="badge badge-host">👑</span>':'')+
      (p.id===PID?'<span class="badge badge-you">Vous</span>':'')+
      '</div>';
  }).join('');
  // ANO-021: Copier + WhatsApp
  var btnCopy=document.getElementById('btn-copy-code');
  var btnWA=document.getElementById('btn-wa-code');
  if(btnCopy){
    btnCopy.onclick=function(){
      if(navigator.clipboard){navigator.clipboard.writeText(gs.code).then(function(){toast('✅ Code '+gs.code+' copié !');});}
      else{var t=document.createElement('textarea');t.value=gs.code;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);toast('✅ Code copié !');}
    };
    btnCopy.addEventListener('touchend',function(e){e.preventDefault();btnCopy.onclick();},false);
  }
  if(btnWA){
    btnWA.onclick=function(){
      var url='https://arnaudmaffre.github.io/pilo-pilo/';
      var msg='Rejoins-moi sur Pili Pili ! Code: *'+gs.code+'* '+url;
      window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
    };
    btnWA.addEventListener('touchend',function(e){e.preventDefault();btnWA.onclick();},false);
  }
  var sw=document.getElementById('lobby-start-wrap');
  if(HOST&&players.length>=2){
    sw.innerHTML='<button class="btn btn-teal" id="btn-launch" type="button">🌶️ Lancer ('+players.length+' joueurs)</button>';
    var bl=document.getElementById('btn-launch');
    bl.addEventListener('click',function(){
      var pl=Object.values(gs.players).sort(function(a,b){return(a.o||0)-(b.o||0);});
      startGame(ROOM,PID,pl).catch(function(e){toast('Erreur: '+e.message);});
    });
    bl.addEventListener('touchend',function(e){e.preventDefault();
      var pl=Object.values(gs.players).sort(function(a,b){return(a.o||0)-(b.o||0);});
      startGame(ROOM,PID,pl).catch(function(e){toast('Erreur: '+e.message);});
    },false);
  }else if(HOST){
    sw.innerHTML='<div style="text-align:center;color:rgba(255,255,255,0.4);font-size:13px;padding:10px">En attente d\'au moins 2 joueurs...</div>';
  }else{
    sw.innerHTML='<div style="text-align:center;color:rgba(255,255,255,0.4);font-size:13px;padding:10px">En attente que l\'hôte lance...</div>';
  }
}

// ════════════════════════════════════════════════════
// START GAME
// ════════════════════════════════════════════════════
function startGame(code,hid,plist){
  var m=MISS[Math.floor(Math.random()*MISS.length)];
  var deck=rnd(mkDeck());
  var hands=[];for(var i=0;i<plist.length;i++)hands.push(deck.slice(i*m.n,(i+1)*m.n));
  var po={};
  plist.forEach(function(p,i){
    po[p.id]={id:p.id,name:p.name,isAI:p.isAI||false,o:i,hand:hands[i],bet:null,tw:0,pilis:p.pilis||0,dt:null,rc:null};
  });
  var ph=initPh(m),fid=plist[0].id;
  var te=m.e==='t3s'?Date.now()+3000:m.e==='t5sblind'?Date.now()+5000:null;
  return DB.ref('rooms/'+code).set({
    code:code,phase:ph,m:m,round:1,dealer:0,hostId:hid,players:po,
    cp:(ph==='betting'||ph==='betblind')?fid:null,
    trick:{_x:true},hist:{_x:true},timerEnd:te,ts:Date.now()
  });
}

// ════════════════════════════════════════════════════
// RENDU JEU
// ════════════════════════════════════════════════════
function rndrGame(gs){
  scr('game');
  var me=gs.players[PID];if(!me)return;
  var players=spl(gs),m=gs.m,rev=m.e==='rev'||m.e==='revblind';
  document.getElementById('gmyname').textContent=me.name;
  document.getElementById('gmypili').innerHTML=ptk(me.pilis||0);
  var lbs={betting:'Paris',playing:'Jeu',sel3of5:'3 cartes à voir',desig:'Désignez',timer:'Mémorisez !',betblind:'Pariez sans voir',reveal:'Découvrez votre main',results:'Résultats',trick_review:'Résultat du pli',exchsel:'Échange — choisissez vos cartes'};
  document.getElementById('gplbl').textContent='Manche '+(gs.round||1)+' · '+(lbs[gs.phase]||gs.phase);
  var md=document.getElementById('gmission');
  md.className='mission-card '+(m.x?'mx':'mn');
  md.innerHTML=(m.x?'<span class="xbadge">EXPERT</span>':'')+
    '<span class="mtitle" style="color:'+(m.x?'#ff6b6b':'#2a9d8f')+'">'+esc(m.t)+' <span style="font-size:11px;opacity:0.4">('+m.n+'c)</span></span>'+
    '<div class="mdesc">'+esc(m.d)+'</div>';
  var isBetting=gs.phase==='betting'||gs.phase==='betblind';
  document.getElementById('gpbar').innerHTML=players.map(function(p,i){
    var act=p.id===gs.cp;
    var betDone=p.bet!==null&&p.bet!==undefined;
    // EVO-003: affichage clair des paris pendant la phase de paris
    var betDisplay=isBetting
      ?(betDone?'<span style="color:#ffd166;font-weight:800;font-size:13px">'+p.bet+' pli'+(p.bet>1?'s':'')+'</span>':'<span style="color:rgba(255,255,255,0.3);font-size:12px">'+(act?'⏳ en cours...':'en attente')+'</span>')
      :'P:'+(betDone?p.bet:'?')+' T:'+(p.tw||0);
    return'<div class="pchip" style="background:'+(act?PC[i%PC.length]+'33':'rgba(255,255,255,0.05)')+';border:2px solid '+(act?PC[i%PC.length]:(betDone&&isBetting?'rgba(255,209,102,0.3)':'rgba(255,255,255,0.1)'))+'">'+
      '<div class="pcname" style="color:'+PC[i%PC.length]+'">'+esc(p.name)+(p.isAI?' 🤖':'')+'</div>'+
      '<div class="ptk">'+ptk(p.pilis||0,6)+'</div>'+
      '<div class="pcinfo">'+betDisplay+'</div></div>';
  }).join('');
  // EVO-003: récap des paris si phase de jeu
  var recapEl=document.getElementById('bets-recap');
  if(!recapEl){
    var ra=document.createElement('div');ra.id='bets-recap';
    ra.style.cssText='background:rgba(255,255,255,0.04);border-radius:12px;padding:8px 14px;margin-bottom:10px;font-size:12px;';
    var gt2=document.getElementById('gtrick');if(gt2)gt2.parentNode.insertBefore(ra,gt2);
  }
  recapEl=document.getElementById('bets-recap');
  if(recapEl){
    if(gs.phase==='playing'||gs.phase==='results'){
      var total=players.reduce(function(a,p){return a+(p.bet||0);},0);
      recapEl.innerHTML='<span style="color:rgba(255,255,255,0.4)">📊 Paris: </span>'+
        players.map(function(p,i){
          var done=p.bet!==null&&p.bet!==undefined;
          return'<span style="color:'+PC[i%PC.length]+';margin-right:8px">'+esc(p.name.split(' ')[0])+': <strong>'+(done?p.bet:'?')+'</strong></span>';
        }).join('')+
        '<span style="color:rgba(255,255,255,0.3)">| Total: '+total+'/'+gs.m.n+'</span>';
      recapEl.style.display='';
    }else{recapEl.style.display='none';}
  }
  var gt=document.getElementById('gtrick');
  if(gs.phase==='reveal'){
    gt.style.display='none';
    document.getElementById('ghlbl').textContent='👁 Découvrez votre main !';
    document.getElementById('ghand').innerHTML=gh(me).map(function(c){return mkCard(c);}).join('');
    var bp=document.getElementById('gbottom');bp.classList.remove('hidden');
    if(HOST){
      bp.innerHTML='<button class="btn btn-teal" id="bstplay" type="button">▶ Commencer à jouer</button>';
      var bsp=document.getElementById('bstplay');
      function doReveal(){var pl=spl(gs);DB.ref('rooms/'+ROOM).update({phase:'playing',cp:pl[gs.dealer%pl.length].id});}
      bsp.addEventListener('click',doReveal);
      bsp.addEventListener('touchend',function(e){e.preventDefault();doReveal();},false);
    }else{bp.innerHTML='<div class="wmsg">En attente de l\'hôte...</div>';}
    return;

  act({type:'bet',v:bet});
}

function applyExchangeFromSel(effect,pl,players){
  var n=pl.length;
  var isRight=['exch1r','exch2r','exch3r'].indexOf(effect)>=0;
  var toGive={},keep={};
  pl.forEach(function(p){
    var hand=gh(players[p.id]).slice();
    var ec=players[p.id].exchCards;
    var given=ec?(Array.isArray(ec)?ec:Object.values(ec).filter(function(x){return x&&x.id;})):[];
    var givenIds=given.map(function(c){return c.id;});
    toGive[p.id]=given;
    keep[p.id]=hand.filter(function(c){return givenIds.indexOf(c.id)<0;});
  });
  var newHands={};
  pl.forEach(function(p,i){
    // isRight: je reçois de mon voisin gauche (i-1) ; isLeft: je reçois de mon voisin droit (i+1)
    var srcIdx=isRight?(i-1+n)%n:(i+1)%n;
    newHands[p.id]=keep[p.id].concat(toGive[pl[srcIdx].id]);
  });
  return newHands;
}

function applyExchange(effect, pl, players){
  var newHands={};
  var n=pl.length;
  // Initialiser avec les mains actuelles
  pl.forEach(function(p){newHands[p.id]=gh(players[p.id]).slice();});

  if(effect==='exchr'||effect==='exchall_right'){
    // Main entière vers la droite
    var tmp=newHands[pl[0].id];
    for(var i=0;i<n-1;i++)newHands[pl[i].id]=newHands[pl[i+1].id];
    newHands[pl[n-1].id]=tmp;
  }else if(effect==='exchl'){
    // Main entière vers la gauche
    var tmp2=newHands[pl[n-1].id];
    for(var i=n-1;i>0;i--)newHands[pl[i].id]=newHands[pl[i-1].id];
    newHands[pl[0].id]=tmp2;
  }else if(effect==='exch2r'){
    // BUG-007 FIX: calcul propre sans mutation
    var saved={};pl.forEach(function(p){saved[p.id]=gh(players[p.id]).slice();});
    pl.forEach(function(p,i){
      // Je garde mes cartes sauf les 2 premières, et je reçois les 2 premières du joueur de gauche
      newHands[p.id]=saved[p.id].slice(2).concat(saved[pl[(i-1+n)%n].id].slice(0,2));
    });
  }else if(effect==='exch2l'){
    // 2 cartes vers la gauche
    var saved2={};pl.forEach(function(p){saved2[p.id]=gh(players[p.id]).slice();});
    pl.forEach(function(p,i){
      var prev=(i-1+n)%n;
      var keep=saved2[p.id].slice(2);
      newHands[p.id]=keep.concat(saved2[pl[(i+1)%n].id].slice(0,2));
    });
  }else if(effect==='exch1r'){
    var saved3={};pl.forEach(function(p){saved3[p.id]=gh(players[p.id]).slice();});
    pl.forEach(function(p,i){
      var prev=(i-1+n)%n;
      newHands[p.id]=saved3[p.id].slice(1).concat([saved3[pl[(i+1)%n].id][0]]);
    });
  }else if(effect==='exch1l'){
    var saved4={};pl.forEach(function(p){saved4[p.id]=gh(players[p.id]).slice();});
    pl.forEach(function(p,i){
      newHands[p.id]=saved4[p.id].slice(1).concat([saved4[pl[(i-1+n)%n].id][0]]);
    });
  }else if(effect==='exch3r'){
    var saved5={};pl.forEach(function(p){saved5[p.id]=gh(players[p.id]).slice();});
    pl.forEach(function(p,i){
      var prev=(i-1+n)%n;
      newHands[p.id]=saved5[p.id].slice(3).concat(saved5[pl[(i+1)%n].id].slice(0,3));
    });
  }else if(effect==='exch3l'){
    var saved6={};pl.forEach(function(p){saved6[p.id]=gh(players[p.id]).slice();});
    pl.forEach(function(p,i){
      newHands[p.id]=saved6[p.id].slice(3).concat(saved6[pl[(i-1+n)%n].id].slice(0,3));
    });
  }
  return newHands;
}

// ════════════════════════════════════════════════════
// ACTION PRINCIPALE
// ════════════════════════════════════════════════════
function act(action){
  if(!ROOM||!DB){toast('⚠️ Non connecté');return;}
  if(BUSY)return;BUSY=true;
  DB.ref('rooms/'+ROOM).get()
  .then(function(s){
    var gs=s.val();if(!gs){BUSY=false;return;}
    var upd={},ph=gs.phase,players=gs.players,m=gs.m,dealer=gs.dealer||0;
    var trick=clnT(gs.trick||{}),hist=clnT(gs.hist||{});
    var pl=spl(gs),np=pl.length,rev=m.e==='rev'||m.e==='revblind';
    var who=action.pid||PID;
    if(action.type==='bet'&&(ph==='betting'||ph==='betblind')){
      upd['rooms/'+ROOM+'/players/'+who+'/bet']=action.v;
      var idx=pl.findIndex(function(p){return p.id===who;});
      var nb=null;for(var k=1;k<np;k++){var ni=(idx+k)%np;if(pl[ni].bet===null||pl[ni].bet===undefined){nb=pl[ni];break;}}
      if(nb){upd['rooms/'+ROOM+'/cp']=nb.id;}
      else{
        var nph=postBet(m);
        // Échange automatique uniquement pour main entière (exchr/exchl)
        if(m.e==='exchr'||m.e==='exchl'){
          var newHands=applyExchange(m.e,pl,players);
          pl.forEach(function(p){
            if(newHands[p.id])upd['rooms/'+ROOM+'/players/'+p.id+'/hand']=newHands[p.id];
          });
        }
        // BUG-002 FIX: draw1 — pioche 1 carte supplémentaire après les paris
        if(m.e==='draw1'){
          var fullDeck=rnd(mkDeck());
          // Retirer les cartes déjà distribuées
          var usedIds={};
          pl.forEach(function(p){gh(players[p.id]).forEach(function(c){usedIds[c.id]=true;});});
          var remaining=fullDeck.filter(function(c){return!usedIds[c.id];});
          pl.forEach(function(p,i){
            var hand=gh(players[p.id]).slice();
            if(remaining[i])hand.push(remaining[i]);
            upd['rooms/'+ROOM+'/players/'+p.id+'/hand']=hand;
          });
        }
        // BUG-004 FIX: exchsim — échange 1 carte automatique (IA et humain)
        if(m.e==='exchsim'){
          var s7={};pl.forEach(function(p){s7[p.id]=gh(players[p.id]).slice();});
          // Chaque joueur échange sa première carte avec le joueur suivant
          pl.forEach(function(p,i){
            var next=(i+1)%pl.length;
            var myCard=s7[p.id][0];
            var theirCard=s7[pl[next].id][0];
            var myHand=s7[p.id].slice(1);myHand.unshift(theirCard);
            upd['rooms/'+ROOM+'/players/'+p.id+'/hand']=myHand;
          });
        }
        upd['rooms/'+ROOM+'/phase']=nph;
        upd['rooms/'+ROOM+'/cp']=(nph==='playing'||nph==='desig')?pl[dealer%np].id:null;
      }
    }
    if(action.type==='sel3'&&ph==='sel3of5'){
      upd['rooms/'+ROOM+'/players/'+who+'/rc']=action.cards;
      var updP=JSON.parse(JSON.stringify(players));updP[who].rc=action.cards;
      if(Object.values(updP).every(function(p){return p.rc&&p.rc.length===3;})){upd['rooms/'+ROOM+'/phase']='betting';upd['rooms/'+ROOM+'/cp']=pl[dealer%np].id;}
    }
    if(action.type==='exchsel'&&ph==='exchsel'){
      upd['rooms/'+ROOM+'/players/'+who+'/exchCards']=action.cards;
      var updP2=JSON.parse(JSON.stringify(players));updP2[who].exchCards=action.cards;
      var allExch=pl.every(function(p){
        var ec=updP2[p.id].exchCards;
        return ec&&(Array.isArray(ec)?ec.length:Object.values(ec).filter(function(x){return x&&x.id;}).length)>0;
      });
      if(allExch){
        var exHands=applyExchangeFromSel(m.e,pl,updP2);
        pl.forEach(function(p){
          upd['rooms/'+ROOM+'/players/'+p.id+'/hand']=exHands[p.id];
          upd['rooms/'+ROOM+'/players/'+p.id+'/exchCards']=null;
        });
        upd['rooms/'+ROOM+'/phase']='playing';
        upd['rooms/'+ROOM+'/cp']=pl[dealer%np].id;
      }
    }
    if(action.type==='desig'&&ph==='desig'){
      upd['rooms/'+ROOM+'/players/'+who+'/dt']=action.target;
      var idx2=pl.findIndex(function(p){return p.id===who;}),nu=null;
      for(var j=idx2+1;j<pl.length;j++){if(!pl[j].dt){nu=pl[j];break;}}
      if(nu){upd['rooms/'+ROOM+'/cp']=nu.id;}else{upd['rooms/'+ROOM+'/phase']='playing';upd['rooms/'+ROOM+'/cp']=pl[dealer%np].id;}
    }
    if(action.type==='play'&&ph==='playing'){
      var player=players[who];if(!player){BUSY=false;return;}
      var h=gh(player),card=h.find(function(c){return c.id===action.id;});if(!card){BUSY=false;return;}
      var nh=h.filter(function(c){return c.id!==action.id;});
      upd['rooms/'+ROOM+'/players/'+who+'/hand']=nh.length>0?nh:{_x:true};
      var played=action.j?{id:card.id,v:action.v,j:true}:card;
      var nt=Object.assign({},trick);nt[who]=played;
      var isLastCard=Object.keys(nt).length===np;
      if(isLastCard){
        // ANO-026 FIX: deux appels séparés pour éviter conflit ancêtre/enfant Firebase
        // 1er appel: écrire la carte jouée dans trick/who
        // 2ème appel: résoudre le pli et reset trick
        var wid=null,wv=rev?Infinity:-Infinity;
        Object.entries(nt).forEach(function(e){var v=ev(e[1],rev);if(rev?v<wv:v>wv){wv=v;wid=e[0];}});
        if(!wid)wid=who;
        var bon={};
        if(m.e==='cursed'&&m.c&&Object.values(nt).some(function(c){return!c.j&&m.c.indexOf(c.v)>=0;}))bon[wid]=(bon[wid]||0)+1;
        if(m.e==='fl'){
          var hl=Object.keys(hist).length,isF=hl===0;
          var uh={};pl.forEach(function(p){uh[p.id]=p.id===who?nh:gh(p);});
          if(isF||Object.values(uh).every(function(x){return!x||x.length===0;}))bon[wid]=(bon[wid]||0)+1;
        }
        Object.entries(bon).forEach(function(e){upd['rooms/'+ROOM+'/players/'+e[0]+'/pilis']=(players[e[0]].pilis||0)+e[1];});
        var ntw=(players[wid].tw||0)+1;
        upd['rooms/'+ROOM+'/players/'+wid+'/tw']=ntw;
        upd['rooms/'+ROOM+'/hist/'+Object.keys(hist).length]=nt;
        var unh={};pl.forEach(function(p){unh[p.id]=p.id===who?nh:gh(p);});
        if(Object.values(unh).every(function(x){return!x||x.length===0;})){
          pl.forEach(function(p){
            var tw=p.id===wid?ntw:(p.tw||0),diff=Math.abs((p.bet||0)-tw);
            var g=m.e==='winminus'&&diff===0?-(p.bet||0):diff;
            var base=upd['rooms/'+ROOM+'/players/'+p.id+'/pilis'];if(base===undefined)base=p.pilis||0;
            var np2=Math.max(0,base+g);
            if(m.e==='desig'&&p.dt&&players[p.dt]){var tgt=players[p.dt],ttw=tgt.id===wid?ntw:(tgt.tw||0);np2=Math.max(0,np2+Math.abs((tgt.bet||0)-ttw));}
            upd['rooms/'+ROOM+'/players/'+p.id+'/pilis']=np2;
          });
          upd['rooms/'+ROOM+'/phase']='results';upd['rooms/'+ROOM+'/cp']=null;
        }else{
          // BUG-005 FIX: exchwin — le gagnant échange 1 carte avec le suivant
          if(m.e==='exchwin'){
            var exchWinHands={};
            pl.forEach(function(p){exchWinHands[p.id]=p.id===who?nh:gh(p);});
            var winIdx=pl.findIndex(function(p){return p.id===wid;});
            var nextIdx=(winIdx+1)%pl.length;
            var winH=exchWinHands[wid].slice();
            var nextH=exchWinHands[pl[nextIdx].id].slice();
            if(winH.length>0&&nextH.length>0){
              var tmp=winH[0];winH[0]=nextH[0];nextH[0]=tmp;
              upd['rooms/'+ROOM+'/players/'+wid+'/hand']=winH;
              upd['rooms/'+ROOM+'/players/'+pl[nextIdx].id+'/hand']=nextH;
            }
          }
          // EVO-004: phase intermédiaire trick_review
          upd['rooms/'+ROOM+'/phase']='trick_review';
          upd['rooms/'+ROOM+'/trickWinner']=wid;
          upd['rooms/'+ROOM+'/cp']=wid;
        }
        // ANO-026: 1er appel pour écrire la carte, 2ème pour update, 3ème pour reset si fin de manche
        return DB.ref('rooms/'+ROOM+'/trick/'+who).set(played)
          .then(function(){return DB.ref().update(upd);})
          .then(function(){
            if(upd['rooms/'+ROOM+'/phase']==='results'){
              return DB.ref('rooms/'+ROOM+'/trick').set({_x:true});
            }
          });
      }else{
        upd['rooms/'+ROOM+'/trick/'+who]=played;
        var ci=pl.findIndex(function(p){return p.id===who;});
        upd['rooms/'+ROOM+'/cp']=pl[(ci+1)%np].id;
      }
    }
    return DB.ref().update(upd);
  })
  .then(function(){
    BUSY=false;
    // ANO-019 FIX: re-check AI turn after action completes
    if(HOST&&GS&&GS.cp&&!BUSY){
      var cp2=GS.players[GS.cp];
      if(cp2&&cp2.isAI){
        clearTimeout(window._ait2);
        window._ait2=setTimeout(function(){BUSY=false;aiTurn(GS,GS.cp);},300);
      }
    }
  })
  .catch(function(e){toast('Erreur: '+e.message);console.error(e);BUSY=false;});
}

// ════════════════════════════════════════════════════
// IA
// ════════════════════════════════════════════════════
function aiTurn(gs,aiId){
  console.log('[AI] aiTurn called, BUSY:',BUSY,'phase:',gs.phase,'aiId:',aiId);
  if(BUSY)return;
  var ph=gs.phase,m=gs.m,ai=gs.players[aiId];if(!ai){console.log('[AI] no ai player found');return;}
  var hand=gh(ai);
  console.log('[AI] hand length:',hand?hand.length:0,'phase:',ph);
  // ANO-019 FIX: ne pas bloquer le pari si la main est vide (missions échange)
  if(ph!=='betting'&&ph!=='betblind'&&(!hand||!hand.length))return;
  var pl=spl(gs),ii=pl.findIndex(function(p){return p.id===aiId;});
  var rev=m.e==='rev'||m.e==='revblind',trick=clnT(gs.trick||{});
  if(ph==='trick_review'){return;} // EVO-004: host handles trick_review
  if(ph==='betting'||ph==='betblind'){
    var ex=pl.slice(0,ii).map(function(p){return p.bet||0;});
    var est=hand.filter(function(c){return ev(c,rev)>28;}).length;
    if(hand.some(function(c){return c.j;}))est=Math.max(est,Math.ceil(hand.length*0.55));
    est=Math.max(0,Math.min(est,hand.length));
    if(ii===pl.length-1){var s=ex.reduce(function(a,b){return a+b;},0);if(s+est===m.n)est=est>0?est-1:est+1;}
    if(m.e==='nob0'&&est===0)est=1;if(m.e==='nob1'&&est===1)est=2;
    console.log('[AI] placing bet:',est,'for',aiId); act({type:'bet',v:Math.max(0,Math.min(est,hand.length||3)),pid:aiId});
  }else if(ph==='playing'){
    var tc=Object.values(trick);
    var sorted=hand.slice().sort(function(a,b){return ev(a,rev)-ev(b,rev);});
    var card=tc.length===0?sorted[Math.floor(sorted.length/2)]:(function(){
      var mx=Math.max.apply(null,tc.map(function(c){return ev(c,rev);}));
      var wn=sorted.filter(function(c){return ev(c,rev)>mx;});
      return wn.length?wn[0]:sorted[sorted.length-1];
    })();
    if(!card)return;
    act({type:'play',id:card.id,v:card.j?28:card.v,j:card.j||false,pid:aiId});
  }else if(ph==='sel3of5'){
    var s2=hand.slice().sort(function(a,b){return ev(b,rev)-ev(a,rev);});
    act({type:'sel3',cards:s2.slice(0,3).map(function(c){return c.id;}),pid:aiId});
  }else if(ph==='desig'){
    var oth=pl.filter(function(p){return p.id!==aiId;});
    if(oth.length)act({type:'desig',target:oth[0].id,pid:aiId});
  }else if(ph==='exchsel'){
    if(!ai.exchCards){
      var nc=exchSelN(m.e);
      act({type:'exchsel',cards:hand.slice(0,nc),pid:aiId});
    }
  }else if(ph==='reveal'&&HOST){
    var pll=spl(gs);DB.ref('rooms/'+ROOM).update({phase:'playing',cp:pll[gs.dealer%pll.length].id});
  }
}

// ════════════════════════════════════════════════════
// DÉMARRAGE — window.onload garantit Firebase chargé
// ════════════════════════════════════════════════════
// Firebase est en <head> donc disponible ici
// On attend que le DOM soit prêt
document.addEventListener('DOMContentLoaded', function() {
  attachAll();
  initFirebase();
});
</script>
