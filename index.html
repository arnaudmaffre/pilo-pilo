<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🌶️ Pili Pili</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0d1b2a;font-family:'Nunito',sans-serif;color:#fff;min-height:100vh;overflow-x:hidden;}
.screen{min-height:100vh;padding:20px 16px 80px;}
.hidden{display:none!important;}

/* HOME */
.home{display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#0d1b2a,#1b2838,#0a1628);}
.logo-emoji{font-size:72px;margin-bottom:8px;animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.logo-title{font-family:'Fredoka One',cursive;font-size:56px;background:linear-gradient(135deg,#ff6b6b,#ffd166,#ff6b6b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:3px;}
.logo-sub{color:rgba(255,255,255,0.4);font-size:13px;letter-spacing:3px;margin-bottom:40px;}
.input-field{width:100%;background:rgba(255,255,255,0.08);border:1.5px solid rgba(255,255,255,0.2);border-radius:14px;padding:14px 18px;color:#fff;font-size:16px;font-family:'Nunito',sans-serif;outline:none;text-align:center;transition:border-color 0.2s;}
.input-field:focus{border-color:rgba(255,209,102,0.6);}
.input-field::placeholder{color:rgba(255,255,255,0.3);}
.btn{width:100%;border:none;border-radius:14px;padding:15px;font-family:'Fredoka One',cursive;font-size:18px;color:#fff;cursor:pointer;transition:transform 0.15s,box-shadow 0.15s;}
.btn:active{transform:scale(0.97);}
.btn-red{background:linear-gradient(135deg,#e63946,#c1121f);box-shadow:0 4px 16px rgba(230,57,70,0.4);}
.btn-teal{background:linear-gradient(135deg,#2a9d8f,#1a7a6a);box-shadow:0 4px 16px rgba(42,157,143,0.4);}
.btn-blue{background:linear-gradient(135deg,#457b9d,#2d5a7a);box-shadow:0 4px 16px rgba(69,123,157,0.4);}
.btn-gold{background:linear-gradient(135deg,#e9c46a,#c9a030);box-shadow:0 4px 16px rgba(233,196,106,0.4);color:#1a1a2a!important;}
.btn-ghost{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.6);}
.btn-row{display:flex;gap:10px;}
.btn-row .btn{flex:1;}
.code-input{font-family:'Fredoka One',cursive;font-size:24px;letter-spacing:8px;text-align:center;text-transform:uppercase;}
.form-group{display:flex;flex-direction:column;gap:10px;width:100%;max-width:400px;}

/* LOBBY */
.lobby{display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#0d1b2a,#1b2838);}
.room-code-display{background:rgba(255,209,102,0.1);border:2px dashed #ffd166;border-radius:14px;padding:12px 36px;display:inline-block;margin-bottom:8px;}
.room-code-value{font-family:'Fredoka One',cursive;font-size:48px;color:#ffd166;letter-spacing:14px;}
.player-row{display:flex;align-items:center;gap:12px;border-radius:12px;padding:12px 16px;margin-bottom:8px;width:100%;max-width:400px;}
.player-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.player-name{flex:1;font-weight:700;}
.badge{font-size:11px;padding:2px 8px;border-radius:6px;}
.badge-host{background:rgba(255,209,102,0.2);color:#ffd166;}
.badge-you{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.5);}

/* GAME */
.game{background:linear-gradient(160deg,#0d1b2a,#1b2838,#0a1628);}
.mission-card{border-radius:16px;padding:12px 16px;margin-bottom:14px;}
.mission-normal{background:linear-gradient(135deg,rgba(42,157,143,0.15),rgba(26,122,106,0.08));border:1px solid rgba(42,157,143,0.4);}
.mission-expert{background:linear-gradient(135deg,rgba(230,57,70,0.15),rgba(193,18,31,0.08));border:1px solid rgba(230,57,70,0.4);}
.expert-badge{font-size:10px;background:#e63946;color:#fff;border-radius:4px;padding:2px 6px;font-weight:800;}
.mission-title{font-family:'Fredoka One',cursive;font-size:17px;}
.mission-desc{font-size:12px;color:rgba(255,255,255,0.6);line-height:1.5;margin-top:4px;}

.players-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
.player-chip{border-radius:12px;padding:8px 12px;min-width:88px;flex-shrink:0;transition:border-color 0.3s;}
.player-chip-name{font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px;margin-bottom:4px;}
.player-chip-info{font-size:10px;color:rgba(255,255,255,0.5);margin-top:4px;}

.pili-track{display:flex;gap:3px;flex-wrap:wrap;}
.pili-dot{width:13px;height:13px;border-radius:50%;transition:all 0.3s;}
.pili-dot.active{background:radial-gradient(circle at 35% 35%,#ff9a9a,#e63946);border:1.5px solid #c1121f;box-shadow:0 1px 5px rgba(230,57,70,0.5);}
.pili-dot.inactive{background:rgba(255,255,255,0.1);border:1.5px solid rgba(255,255,255,0.2);}

.trick-area{background:rgba(255,255,255,0.04);border-radius:16px;padding:14px;margin-bottom:14px;}
.trick-label{font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:10px;}
.trick-cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;min-height:70px;align-items:center;}
.trick-card-wrap{text-align:center;}
.trick-player-name{font-size:10px;color:rgba(255,255,255,0.5);margin-top:4px;}

.hand-area{margin-bottom:16px;}
.hand-label{font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:10px;}
.hand-cards{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}

/* CARD */
.card{border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1);position:relative;user-select:none;flex-shrink:0;}
.card:active{transform:scale(0.95)!important;}
.card.selected{transform:translateY(-10px)!important;box-shadow:0 0 14px #ffd166!important;}
.card.hidden-card{background:linear-gradient(135deg,#1a2a4a,#0d1b2a)!important;border-color:rgba(255,255,255,0.12)!important;}
.card-value{font-family:'Fredoka One',cursive;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,0.5);}
.card-select-badge{position:absolute;top:-7px;left:50%;transform:translateX(-50%);background:#ffd166;border-radius:4px;padding:1px 5px;font-size:9px;color:#1a1a2a;font-weight:900;}

/* BOTTOM PANEL */
.bottom-panel{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(to top,#0d1b2a,rgba(13,27,42,0.97));padding:16px 20px 28px;border-top:1px solid rgba(255,255,255,0.1);z-index:50;}
.bet-row{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:12px;}
.bet-btn{background:rgba(255,255,255,0.1);border:none;border-radius:10px;width:46px;height:46px;color:#fff;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.bet-value{font-family:'Fredoka One',cursive;font-size:52px;color:#ffd166;min-width:60px;text-align:center;}
.bet-info{font-size:13px;color:rgba(255,255,255,0.6);text-align:center;margin-bottom:10px;}
.waiting-msg{text-align:center;color:rgba(255,255,255,0.5);font-size:14px;padding:10px 0;}

/* TIMER */
.timer-display{text-align:center;margin-bottom:16px;}
.timer-number{font-family:'Fredoka One',cursive;font-size:80px;line-height:1;}
.timer-label{color:rgba(255,255,255,0.6);font-size:14px;margin-top:4px;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:100;}
.modal{background:#1b2838;border-radius:20px;padding:24px;width:90%;max-width:320px;text-align:center;}
.modal-title{font-family:'Fredoka One',cursive;font-size:22px;color:#ffd166;margin-bottom:16px;}
.modal-row{display:flex;gap:10px;margin-top:16px;}

/* RESULTS */
.results{background:linear-gradient(160deg,#0d1b2a,#1b2838);}
.result-row{border-radius:14px;padding:14px 18px;margin-bottom:10px;}
.result-name{font-family:'Fredoka One',cursive;font-size:18px;}
.result-status{font-size:13px;font-weight:800;}
.result-detail{font-size:12px;color:rgba(255,255,255,0.5);margin-top:2px;}

/* TOAST */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#e63946;color:#fff;border-radius:12px;padding:10px 20px;z-index:999;font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;cursor:pointer;animation:slideDown 0.3s ease;}
@keyframes slideDown{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

.section-title{font-family:'Fredoka One',cursive;font-size:14px;color:rgba(255,255,255,0.5);letter-spacing:1px;margin-bottom:8px;}
.reversed-warning{text-align:center;color:#ff6b6b;font-size:11px;margin-top:6px;}
input[type=range]{width:100%;accent-color:#ffd166;}
</style>
</head>
<body>

<!-- HOME -->
<div id="screen-home" class="screen home">
  <div class="logo-emoji">🌶️</div>
  <div class="logo-title">PILI PILI</div>
  <div class="logo-sub">LE JEU DE PLIS ET DE PARIS</div>
  <div class="form-group">
    <input id="home-name" class="input-field" placeholder="Votre prénom..." maxlength="20"/>
    <button class="btn btn-red" onclick="handleSolo()">🤖 Solo vs IA</button>
    <div class="btn-row">
      <button class="btn btn-blue" onclick="handleMatchmaking()">🌐 Matchmaking</button>
      <button class="btn btn-teal" onclick="handleCreateRoom()">🏠 Créer salle</button>
    </div>
    <div class="btn-row">
      <input id="join-code" class="input-field code-input" placeholder="CODE" maxlength="4" style="flex:1"/>
      <button class="btn btn-gold" onclick="handleJoinRoom()" style="flex:1">Rejoindre →</button>
    </div>
  </div>
</div>

<!-- LOBBY -->
<div id="screen-lobby" class="screen lobby hidden">
  <div style="text-align:center;margin-bottom:28px;">
    <div style="font-size:48px;">🏠</div>
    <h2 style="font-family:'Fredoka One',cursive;font-size:30px;color:#ffd166;margin:8px 0;">Salle privée</h2>
    <div class="room-code-display"><div id="lobby-code" class="room-code-value">----</div></div>
    <div style="color:rgba(255,255,255,0.5);font-size:13px;margin-top:6px;">Partagez ce code à vos amis</div>
  </div>
  <div id="lobby-players" style="width:100%;max-width:400px;"></div>
  <div style="width:100%;max-width:400px;margin-top:8px;">
    <div id="lobby-start-wrap"></div>
    <button class="btn btn-ghost" style="margin-top:10px;" onclick="handleLeave()">Quitter la salle</button>
  </div>
</div>

<!-- GAME -->
<div id="screen-game" class="screen game hidden">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
    <div>
      <div style="font-family:'Fredoka One',cursive;font-size:24px;color:#ffd166;">🌶️ Pili Pili</div>
      <div id="game-phase-label" style="font-size:12px;color:rgba(255,255,255,0.4);"></div>
    </div>
    <div style="text-align:right;">
      <div style="font-size:11px;color:rgba(255,255,255,0.5);">Vous</div>
      <div id="game-my-name" style="font-family:'Fredoka One',cursive;font-size:17px;"></div>
      <div id="game-my-pilis" class="pili-track" style="justify-content:flex-end;"></div>
    </div>
  </div>
  <div id="game-mission" class="mission-card"></div>
  <div id="game-players-bar" class="players-bar"></div>
  <div id="game-timer" class="timer-display hidden"></div>
  <div id="game-trick" class="trick-area">
    <div class="trick-label">Pli en cours</div>
    <div id="game-trick-cards" class="trick-cards"><span style="color:rgba(255,255,255,0.3);font-size:14px;">En attente...</span></div>
  </div>
  <div class="hand-area">
    <div id="game-hand-label" class="hand-label"></div>
    <div id="game-hand" class="hand-cards"></div>
  </div>
  <div id="game-bottom" class="bottom-panel hidden"></div>
</div>

<!-- RESULTS -->
<div id="screen-results" class="screen results hidden">
  <div style="text-align:center;margin-bottom:24px;">
    <div id="results-emoji" style="font-size:56px;"></div>
    <h2 id="results-title" style="font-family:'Fredoka One',cursive;font-size:30px;color:#ffd166;margin:8px 0;"></h2>
  </div>
  <div id="results-list"></div>
  <div id="results-actions" style="margin-top:20px;"></div>
</div>

<!-- MODALS -->
<div id="modal-joker" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-title">🔥 Valeur du Joker</div>
    <input type="range" min="0" max="56" value="28" id="joker-slider" oninput="document.getElementById('joker-val').textContent=this.value"/>
    <div id="joker-val" style="font-family:'Fredoka One',cursive;font-size:52px;color:#ffd166;margin:10px 0;">28</div>
    <div class="modal-row">
      <button class="btn btn-ghost" style="flex:1" onclick="closeJokerModal()">Annuler</button>
      <button class="btn btn-red" style="flex:1" onclick="confirmJoker()">Jouer</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

// ── CARD COLOR ─────────────────────────────────────────────────────────────
function getCardColor(n) {
  if (!n) return {bg:"#1a1a2e",border:"#ff6b35"};
  const stops=[{at:1,bg:"#1a2a6c"},{at:8,bg:"#2a4a8c"},{at:14,bg:"#3a7ab5"},{at:20,bg:"#4a8a7a"},{at:25,bg:"#5a8a4a"},{at:30,bg:"#7a9a2a"},{at:35,bg:"#a8a020"},{at:40,bg:"#c88018"},{at:45,bg:"#c85020"},{at:50,bg:"#b03030"},{at:55,bg:"#6b2010"}];
  let lo=stops[0],hi=stops[stops.length-1];
  for(let i=0;i<stops.length-1;i++){if(n>=stops[i].at&&n<=stops[i+1].at){lo=stops[i];hi=stops[i+1];break;}}
  const t=(n-lo.at)/Math.max(hi.at-lo.at,1);
  const lerp=(a,b)=>Math.round(a+(b-a)*t);
  const hex=v=>v.toString(16).padStart(2,"0");
  const pr=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
  const [r1,g1,b1]=pr(lo.bg),[r2,g2,b2]=pr(hi.bg);
  return {bg:`#${hex(lerp(r1,r2))}${hex(lerp(g1,g2))}${hex(lerp(b1,b2))}`,border:"rgba(255,255,255,0.25)"};
}

// ── HELPERS ────────────────────────────────────────────────────────────────
function genCode(){return Math.random().toString(36).substr(2,4).toUpperCase();}
function buildDeck(){
  const d=Array.from({length:55},(_,i)=>({id:i+1,value:i+1,isJoker:false}));
  d.push({id:56,value:null,isJoker:true});
  return d;
}
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function effectiveVal(card,rev){if(!card)return 0;if(card.isJoker)return rev?-1:57;return rev?56-card.value:card.value;}
function sortedPlayers(gs){return Object.values(gs.players||{}).sort((a,b)=>a.order-b.order);}

function showToast(msg,ms=3000){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.remove('hidden');
  setTimeout(()=>t.classList.add('hidden'),ms);
}

// ── RENDER HELPERS ────────────────────────────────────────────────────────
function renderPiliTrack(count,max=6){
  return Array.from({length:max}).map((_,i)=>`<div class="pili-dot ${i<count?'active':'inactive'}"></div>`).join('');
}

function renderCard(card,opts={}){
  const {size='normal',hidden=false,selected=false,onclick='',small=false}=opts;
  const w=small?44:64, h=small?62:90, fs=small?18:28;
  const col=getCardColor(card.isJoker?0:card.value);
  const bg=hidden?'linear-gradient(135deg,#1a2a4a,#0d1b2a)':col.bg;
  const border=selected?'#ffd166':hidden?'rgba(255,255,255,0.1)':col.border;
  const shadow=selected?'0 0 14px #ffd166':'0 3px 10px rgba(0,0,0,0.4)';
  const transform=selected?'translateY(-10px)':'none';
  const content=hidden?'<span style="font-size:18px;opacity:0.25">🌶️</span>':card.isJoker?`<span style="font-size:${fs}px">🔥</span>`:`<span class="card-value" style="font-size:${fs}px">${card.value}</span>`;
  const badge=selected?`<div class="card-select-badge">✓</div>`:'';
  return `<div class="card${selected?' selected':''}" style="width:${w}px;height:${h}px;background:${bg};border:2px solid ${border};box-shadow:${shadow};transform:${transform};" onclick="${onclick}" data-card-id="${card.id}">${content}${badge}</div>`;
}

// ── HOME HANDLERS ─────────────────────────────────────────────────────────
async function handleSolo(){
  const name=document.getElementById('home-name').value.trim();
  if(!name){showToast('Entrez votre prénom !');return;}
  const code='SOLO'+Math.floor(Math.random()*9000+1000);
  const players=[
    {id:playerId,name,isAI:false,pilis:0,order:0},
    {id:'ai1',name:'Robo-Chili 🤖',isAI:true,pilis:0,order:1},
    {id:'ai2',name:'Capsaïco 🤖',isAI:true,pilis:0,order:2},
  ];
  roomCode=code; isHost=true;
  await startGame(code,playerId,players);
  subscribeRoom(code);
  showScreen('game');
}

async function handleCreateRoom(){
  const name=document.getElementById('home-name').value.trim();
  if(!name){showToast('Entrez votre prénom !');return;}
  const code=genCode();
  const player={id:playerId,name,isAI:false,pilis:0};
  await db.ref(`rooms/${code}`).set({code,phase:'lobby',hostId:playerId,players:{[playerId]:player},createdAt:Date.now()});
  roomCode=code; isHost=true;
  subscribeRoom(code);
  showScreen('lobby');
}

async function handleJoinRoom(){
  const name=document.getElementById('home-name').value.trim();
  const code=document.getElementById('join-code').value.trim().toUpperCase();
  if(!name){showToast('Entrez votre prénom !');return;}
  if(code.length!==4){showToast('Code invalide (4 lettres)');return;}
  const snap=await db.ref(`rooms/${code}`).get();
  const room=snap.val();
  if(!room){showToast('Salle introuvable');return;}
  if(Object.keys(room.players||{}).length>=8){showToast('Salle pleine (8 max)');return;}
  const player={id:playerId,name,isAI:false,pilis:0};
  await db.ref(`rooms/${code}/players/${playerId}`).set(player);
  roomCode=code; isHost=false;
  subscribeRoom(code);
  showScreen('lobby');
}

async function handleMatchmaking(){
  const name=document.getElementById('home-name').value.trim();
  if(!name){showToast('Entrez votre prénom !');return;}
  const snap=await db.ref('rooms').get();
  const rooms=snap.val()||{};
  const open=Object.values(rooms).find(r=>r.phase==='lobby'&&Object.keys(r.players||{}).length<8&&r.code!=='SOLO');
  if(open){document.getElementById('join-code').value=open.code;await handleJoinRoom();}
  else await handleCreateRoom();
}

async function handleLeave(){
  if(roomCode){
    await db.ref(`rooms/${roomCode}/players/${playerId}`).remove();
    if(roomListener){db.ref(`rooms/${roomCode}`).off();roomListener=null;}
  }
  roomCode=null;isHost=false;gameState=null;
  showScreen('home');
}

// ── ROOM SUBSCRIPTION ─────────────────────────────────────────────────────
function subscribeRoom(code){
  if(roomListener){db.ref(`rooms/${roomListener}`).off();}
  roomListener=code;
  db.ref(`rooms/${code}`).on('value',snap=>{
    const data=snap.val();
    if(!data){roomCode=null;showScreen('home');return;}
    gameState=data;
    const ph=data.phase;
    if(ph==='lobby')renderLobby(data);
    else if(ph==='results')renderResults(data);
    else renderGame(data);
    // AI turns
    if(isHost&&data.currentPlayer){
      const cp=data.players[data.currentPlayer];
      if(cp&&cp.isAI)setTimeout(()=>handleAITurn(data,data.currentPlayer),1000);
    }
    // Timer phases
    if((ph==='timer_viewing'||ph==='timer_3s_viewing')&&data.timerEnd){
      startTimerUI(data.timerEnd,()=>{
        if(isHost)db.ref(`rooms/${code}`).update({phase:'playing',currentPlayer:sortedPlayers(data)[data.dealer%sortedPlayers(data).length].id});
      });
    }
  });
}

// ── START GAME ────────────────────────────────────────────────────────────
async function startGame(code,hostId,playersList){
  const mission=MISSIONS[Math.floor(Math.random()*MISSIONS.length)];
  const hands=dealCards(mission,playersList.length);
  const playersObj={};
  playersList.forEach((p,i)=>{
    playersObj[p.id]={...p,order:i,hand:hands[i],bet:null,tricksWon:0,pilis:p.pilis||0,designatedTarget:null,revealedCards:null};
  });
  const firstBetter=playersList[0];
  const phase=getInitialPhase(mission);
  const gs={code,phase,mission,round:1,dealer:0,players:playersObj,
    currentPlayer:phase==='betting'||phase==='bet_before_see'?firstBetter.id:null,
    currentTrick:{},trickHistory:{},hostId,
    timerEnd:['timer_3s','timer_5s_blind'].includes(mission.effect)?Date.now()+(mission.effect==='timer_3s'?3000:5000):null
  };
  await db.ref(`rooms/${code}`).set(gs);
  showScreen('game');
}

function getInitialPhase(mission){
  if(['timer_3s','timer_5s_blind'].includes(mission.effect))return 'timer_viewing';
  if(mission.effect==='three_of_five')return 'three_of_five_select';
  if(mission.effect==='bet_before_see')return 'bet_before_see';
  return 'betting';
}

function dealCards(mission,numPlayers){
  const deck=shuffle(buildDeck());
  const n=mission.cards;
  return Array.from({length:numPlayers},(_,i)=>deck.slice(i*n,(i+1)*n));
}

// ── GAME RENDER ───────────────────────────────────────────────────────────
function renderGame(gs){
  showScreen('game');
  const me=gs.players[playerId];
  if(!me)return;
  const players=sortedPlayers(gs);
  const mission=gs.mission;
  const reversed=mission.effect==='reversed'||mission.effect==='reversed_hidden';

  // Header
  document.getElementById('game-my-name').textContent=me.name;
  document.getElementById('game-my-pilis').innerHTML=renderPiliTrack(me.pilis||0);
  const phaseLabels={betting:'Paris en cours',playing:'Jeu en cours',results:'Résultats',
    three_of_five_select:'Choisissez 3 cartes',designate:'Désignez un joueur',
    timer_viewing:'Mémorisez !',bet_before_see:'Pariez sans voir !',cards_face_up:'Cartes visibles'};
  document.getElementById('game-phase-label').textContent=`Manche ${gs.round||1} · ${phaseLabels[gs.phase]||gs.phase}`;

  // Mission
  const mDiv=document.getElementById('game-mission');
  mDiv.className=`mission-card ${mission.expert?'mission-expert':'mission-normal'}`;
  mDiv.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
          ${mission.expert?'<span class="expert-badge">EXPERT</span>':''}
          <span class="mission-title" style="color:${mission.expert?'#ff6b6b':'#2a9d8f'}">${mission.title}</span>
        </div>
        <div class="mission-desc">${mission.desc}</div>
      </div>
      <div style="font-family:'Fredoka One',cursive;font-size:26px;color:rgba(255,255,255,0.25);margin-left:10px;">${mission.cards}c</div>
    </div>`;

  // Players bar
  document.getElementById('game-players-bar').innerHTML=players.map((p,i)=>{
    const isActive=p.id===gs.currentPlayer;
    return `<div class="player-chip" style="background:${isActive?PLAYER_COLORS[i%PLAYER_COLORS.length]+'33':'rgba(255,255,255,0.05)'};border:1px solid ${isActive?PLAYER_COLORS[i%PLAYER_COLORS.length]:'rgba(255,255,255,0.1)'};">
      <div class="player-chip-name" style="color:${PLAYER_COLORS[i%PLAYER_COLORS.length]}">${p.name}${p.isAI?' 🤖':''}</div>
      <div class="pili-track">${renderPiliTrack(p.pilis||0,6)}</div>
      <div class="player-chip-info">P:${p.bet!==null&&p.bet!==undefined?p.bet:'?'} Pli:${p.tricksWon||0}</div>
    </div>`;
  }).join('');

  // Trick area
  const trick=gs.currentTrick||{};
  const trickEntries=Object.entries(trick);
  const isBlind=['reversed_hidden','timer_5s_blind','blind_forehead'].includes(mission.effect);
  if(trickEntries.length===0){
    document.getElementById('game-trick-cards').innerHTML='<span style="color:rgba(255,255,255,0.3);font-size:14px;">En attente du premier joueur...</span>';
  } else {
    document.getElementById('game-trick-cards').innerHTML=trickEntries.map(([pid,card])=>{
      const p=gs.players[pid];
      return `<div class="trick-card-wrap">${renderCard(card,{small:true,hidden:isBlind&&pid!==playerId})}<div class="trick-player-name">${p?.name||'?'}</div></div>`;
    }).join('');
  }
  if(reversed){
    document.getElementById('game-trick').insertAdjacentHTML('beforeend','<div class="reversed-warning">⚠️ Valeurs inversées — la plus faible l\'emporte !</div>');
  }

  // Hand
  const hand=me.hand||[];
  const isTimerBlind=gs.phase==='timer_5s_blind_play';
  const isBlindForehead=mission.effect==='blind_forehead';
  document.getElementById('game-hand-label').textContent=`Votre main (${hand.length} carte${hand.length>1?'s':''})${gs.phase==='three_of_five_select'?' — Cliquez sur 3 cartes à regarder':''}`;

  if(gs.phase==='three_of_five_select'){
    document.getElementById('game-hand').innerHTML=hand.map(c=>{
      const sel=selectedCards.includes(c.id);
      return renderCard(c,{hidden:!sel,selected:sel,onclick:`toggleSelectCard(${c.id})`});
    }).join('');
  } else {
    const hideMyCards=isTimerBlind||isBlindForehead;
    document.getElementById('game-hand').innerHTML=hand.map(c=>{
      const canPlay=gs.phase==='playing'&&gs.currentPlayer===playerId;
      return renderCard(c,{hidden:hideMyCards,onclick:canPlay?`clickCard(${c.id})`:''});
    }).join('');
  }

  // Bottom panel
  renderBottomPanel(gs,me,players);
}

function renderBottomPanel(gs,me,players){
  const panel=document.getElementById('game-bottom');
  const ph=gs.phase;
  const isMyTurn=gs.currentPlayer===playerId;
  const mission=gs.mission;

  panel.classList.remove('hidden');

  if((ph==='betting'||ph==='bet_before_see')&&isMyTurn){
    const totalBets=players.reduce((a,p)=>a+(p.bet??0),0);
    const numCards=mission.cards;
    const myBet=me.bet??0;
    const forbidden=mission.effect==='no_bet_0'?[0]:mission.effect==='no_bet_1'?[1]:[];
    panel.innerHTML=`
      <div class="bet-info">Total parié : <strong>${totalBets}</strong> / ${numCards} cartes
        ${totalBets===numCards?'<span style="color:#e63946"> ⚠️ Total interdit !</span>':''}</div>
      <div class="bet-row">
        <button class="bet-btn" onclick="changeBet(-1)">−</button>
        <div class="bet-value" id="live-bet">${myBet}</div>
        <button class="bet-btn" onclick="changeBet(1)">+</button>
      </div>
      ${forbidden.length?`<div style="font-size:11px;color:#ff6b6b;text-align:center;margin-bottom:8px;">Interdit de parier ${forbidden.join(' ou ')}</div>`:''}
      <button class="btn btn-gold" onclick="submitBet()">✅ Confirmer le pari de <span id="btn-bet-val">${myBet}</span></button>`;
    window._currentBet=myBet;
  } else if(ph==='playing'&&isMyTurn){
    panel.innerHTML=`<div style="text-align:center;color:#2a9d8f;font-size:15px;font-weight:800;">🎯 C'est votre tour — jouez une carte !</div>`;
  } else if(ph==='three_of_five_select'){
    panel.innerHTML=`
      <div style="text-align:center;color:rgba(255,255,255,0.7);font-size:13px;margin-bottom:10px;">${selectedCards.length}/3 cartes sélectionnées</div>
      <button class="btn btn-blue" onclick="confirmThreeOfFive()" ${selectedCards.length!==3?'disabled style="opacity:0.4"':''}>👁 Regarder ces 3 cartes</button>`;
  } else if(ph==='designate'&&isMyTurn){
    const others=players.filter(p=>p.id!==playerId);
    panel.innerHTML=`
      <div style="font-size:13px;color:rgba(255,255,255,0.7);margin-bottom:10px;text-align:center;">Désignez un joueur (vous recevrez aussi ses Pilis)</div>
      ${others.map((p,i)=>`<button class="btn" style="margin-bottom:8px;background:${selectedCards[0]===p.id?PLAYER_COLORS[i%PLAYER_COLORS.length]+'44':'rgba(255,255,255,0.07)'};border:1px solid ${selectedCards[0]===p.id?PLAYER_COLORS[i%PLAYER_COLORS.length]:'rgba(255,255,255,0.1)'};" onclick="selectDesignate('${p.id}')">${p.name}</button>`).join('')}
      <button class="btn btn-red" onclick="confirmDesignate()" ${selectedCards.length!==1?'disabled style="opacity:0.4;margin-top:4px"':'style="margin-top:4px"'}>❤️ Désigner</button>`;
  } else {
    panel.innerHTML=`<div class="waiting-msg">⏳ En attente de <strong style="color:#ffd166">${gs.players[gs.currentPlayer]?.name||'...'}</strong></div>`;
    if(ph==='playing'&&!isMyTurn){}
    else panel.classList.add('hidden');
  }
}

// ── CARD INTERACTIONS ─────────────────────────────────────────────────────
function toggleSelectCard(cardId){
  if(selectedCards.includes(cardId)){
    selectedCards=selectedCards.filter(x=>x!==cardId);
  } else if(selectedCards.length<3){
    selectedCards.push(cardId);
  }
  if(gameState)renderGame(gameState);
}

function confirmThreeOfFive(){
  if(selectedCards.length!==3)return;
  processAction(playerId,{type:'select_three',cards:[...selectedCards]});
  selectedCards=[];
}

function selectDesignate(targetId){
  selectedCards=[targetId];
  if(gameState)renderGame(gameState);
}

function confirmDesignate(){
  if(!selectedCards[0])return;
  processAction(playerId,{type:'designate_player',targetId:selectedCards[0]});
  selectedCards=[];
}

let _liveBet=0;
function changeBet(delta){
  _liveBet=Math.max(0,Math.min((gameState?.mission?.cards||5),(_liveBet||window._currentBet||0)+delta));
  window._currentBet=_liveBet;
  const el=document.getElementById('live-bet');
  const el2=document.getElementById('btn-bet-val');
  if(el)el.textContent=_liveBet;
  if(el2)el2.textContent=_liveBet;
}

function submitBet(){
  const bet=window._currentBet||0;
  const gs=gameState;
  const players=sortedPlayers(gs);
  const mission=gs.mission;
  // Check forbidden
  if(mission.effect==='no_bet_0'&&bet===0){showToast('Interdit de parier 0 !');return;}
  if(mission.effect==='no_bet_1'&&bet===1){showToast('Interdit de parier 1 !');return;}
  // Check no_copy_bet
  if(mission.effect==='no_copy_bet'){
    const myIdx=players.findIndex(p=>p.id===playerId);
    if(myIdx>0&&players[myIdx-1].bet===bet){showToast('Interdit de copier le pari précédent !');return;}
  }
  // Check constraint: sum must not equal numCards
  const others=players.filter(p=>p.id!==playerId&&p.bet!==null&&p.bet!==undefined);
  const sumOthers=others.reduce((a,p)=>a+p.bet,0);
  if(sumOthers+bet===mission.cards){
    const isLast=players.filter(p=>p.bet===null||p.bet===undefined).length===1;
    if(isLast){showToast(`Interdit ! Le total ne peut pas être ${mission.cards}`);return;}
  }
  processAction(playerId,{type:'place_bet',bet});
}

function clickCard(cardId){
  const gs=gameState;
  if(!gs||gs.currentPlayer!==playerId||gs.phase!=='playing')return;
  const me=gs.players[playerId];
  const card=me.hand.find(c=>c.id===cardId);
  if(!card)return;
  if(card.isJoker){pendingJokerCardId=cardId;openJokerModal();return;}
  processAction(playerId,{type:'play_card',cardId,value:card.value,isJoker:false});
}

function openJokerModal(){document.getElementById('modal-joker').classList.remove('hidden');}
function closeJokerModal(){document.getElementById('modal-joker').classList.add('hidden');pendingJokerCardId=null;}
function confirmJoker(){
  const val=parseInt(document.getElementById('joker-slider').value);
  document.getElementById('modal-joker').classList.add('hidden');
  if(pendingJokerCardId!==null)processAction(playerId,{type:'play_card',cardId:pendingJokerCardId,value:val,isJoker:true});
  pendingJokerCardId=null;
}

// ── TIMER UI ──────────────────────────────────────────────────────────────
function startTimerUI(endTs,onDone){
  clearInterval(timerInterval);
  const div=document.getElementById('game-timer');
  div.classList.remove('hidden');
  timerInterval=setInterval(()=>{
    const left=Math.max(0,Math.ceil((endTs-Date.now())/1000));
    div.innerHTML=`<div class="timer-number" style="color:${left<=2?'#e63946':'#ffd166'}">${left}</div><div class="timer-label">Mémorisez vos cartes !</div>`;
    if(left<=0){clearInterval(timerInterval);div.classList.add('hidden');if(onDone)onDone();}
  },200);
}

  document.getElementById('results-list').innerHTML=players.map((p,i)=>{
    const diff=Math.abs((p.bet??0)-(p.tricksWon||0));
    const ok=diff===0;
    return `<div class="result-row" style="background:${p.id===playerId?'rgba(255,209,102,0.1)':'rgba(255,255,255,0.04)'};border:1px solid ${p.id===playerId?'rgba(255,209,102,0.4)':'rgba(255,255,255,0.08)'};">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div class="result-name" style="color:${i===0&&gameOver?'#ffd166':'#fff'}">${i===0&&gameOver?'🏆 ':''}${p.name}${p.isAI?' 🤖':''}</div>
          <div class="pili-track" style="margin-top:4px;">${renderPiliTrack(p.pilis||0)}</div>
        </div>
        <div style="text-align:right;">
          <div class="result-status" style="color:${ok?'#2a9d8f':'#e63946'}">${ok?'✅ Réussi !':'❌ +'+diff+' Pili'+(diff>1?'s':'')}</div>
          <div class="result-detail">Pari: ${p.bet??'-'} · Plis: ${p.tricksWon||0}</div>
        </div>
      </div>
    </div>`;
  }).join('');
  const actDiv=document.getElementById('results-actions');
  if(isHost){
    if(!gameOver){
      actDiv.innerHTML=`<button class="btn btn-teal" onclick="handleNextRound()">➡️ Manche suivante</button>`;
    } else {
      actDiv.innerHTML=`<button class="btn btn-red" onclick="handleNewGame()">🔄 Nouvelle partie</button>`;
    }
  } else {
    actDiv.innerHTML=`<div style="text-align:center;color:rgba(255,255,255,0.4);font-size:14px;">En attente de l'hôte...</div>`;
  }
}

async function handleNextRound(){
  if(!gameState||!roomCode)return;
  const gs=gameState;
  const players=sortedPlayers(gs);
  const newDealer=(gs.dealer+1)%players.length;
  const mission=MISSIONS[Math.floor(Math.random()*MISSIONS.length)];
  const hands=dealCards(mission,players.length);
  const playersObj={};
  players.forEach((p,i)=>{
    playersObj[p.id]={...p,hand:hands[i],bet:null,tricksWon:0,designatedTarget:null,revealedCards:null};
  });
  const phase=getInitialPhase(mission);
  const firstP=players[newDealer%players.length];
  await db.ref(`rooms/${roomCode}`).update({
    phase,mission,round:(gs.round||1)+1,dealer:newDealer,
    players:playersObj,currentPlayer:phase==='betting'||phase==='bet_before_see'?firstP.id:null,
    currentTrick:{},trickHistory:{},
    timerEnd:['timer_3s','timer_5s_blind'].includes(mission.effect)?Date.now()+(mission.effect==='timer_3s'?3000:5000):null
  });
}

async function handleNewGame(){
  if(roomCode){await db.ref(`rooms/${roomCode}`).remove();}
  roomCode=null;isHost=false;gameState=null;selectedCards=[];
  showScreen('home');
}

// ── ACTION PROCESSOR ──────────────────────────────────────────────────────
async function processAction(actPid,action){
  if(!roomCode)return;
  const snap=await db.ref(`rooms/${roomCode}`).get();
  const gs=snap.val();
  if(!gs)return;
  const updates={};
  const {phase,players,mission,currentTrick,trickHistory,dealer}=gs;
  const playerList=sortedPlayers(gs);
  const numPlayers=playerList.length;
  const reversed=mission.effect==='reversed'||mission.effect==='reversed_hidden';

  if((action.type==='place_bet')&&(phase==='betting'||phase==='bet_before_see')){
    updates[`rooms/${roomCode}/players/${actPid}/bet`]=action.bet;
    const idx=playerList.findIndex(p=>p.id===actPid);
    const nextUnbet=playerList.slice(idx+1).find(p=>p.bet===null||p.bet===undefined);
    if(nextUnbet){
      updates[`rooms/${roomCode}/currentPlayer`]=nextUnbet.id;
    } else {
      // All bets in — next phase
      const np=getPostBetPhase(mission);
      updates[`rooms/${roomCode}/phase`]=np;
      if(np==='playing'){
        updates[`rooms/${roomCode}/currentPlayer`]=playerList[dealer%numPlayers].id;
      } else if(np==='designate'||np==='exchange_select'){
        updates[`rooms/${roomCode}/currentPlayer`]=playerList[dealer%numPlayers].id;
      }
    }
  }

  if(action.type==='select_three'&&phase==='three_of_five_select'){
    updates[`rooms/${roomCode}/players/${actPid}/revealedCards`]=action.cards;
    const allDone=playerList.every(p=>p.id===actPid||(p.revealedCards&&p.revealedCards.length===3));
    if(allDone){
      updates[`rooms/${roomCode}/phase`]='betting';
      updates[`rooms/${roomCode}/currentPlayer`]=playerList[dealer%numPlayers].id;
    }
  }

  if(action.type==='designate_player'&&phase==='designate'){
    updates[`rooms/${roomCode}/players/${actPid}/designatedTarget`]=action.targetId;
    const idx=playerList.findIndex(p=>p.id===actPid);
    const nextUndone=playerList.slice(idx+1).find(p=>!p.designatedTarget);
    if(nextUndone){
      updates[`rooms/${roomCode}/currentPlayer`]=nextUndone.id;
    } else {
      updates[`rooms/${roomCode}/phase`]='playing';
      updates[`rooms/${roomCode}/currentPlayer`]=playerList[dealer%numPlayers].id;
    }
  }

  if(action.type==='play_card'&&phase==='playing'){
    const player=players[actPid];
    const card=player.hand.find(c=>c.id===action.cardId);
    if(!card)return;
    const newHand=player.hand.filter(c=>c.id!==action.cardId);
    updates[`rooms/${roomCode}/players/${actPid}/hand`]=newHand;
    const played=action.isJoker?{...card,value:action.value}:card;
    updates[`rooms/${roomCode}/currentTrick/${actPid}`]=played;
    const newTrick={...(currentTrick||{}),[actPid]:played};
    const allPlayed=Object.keys(newTrick).length===numPlayers;
    if(allPlayed){
      // Resolve trick
      let winnerId=null,winVal=reversed?Infinity:-Infinity;
      for(const[pid,c] of Object.entries(newTrick)){
        const v=effectiveVal(c,reversed);
        if(reversed?v<winVal:v>winVal){winVal=v;winnerId=pid;}
      }
      // Bonus Pilis
      let bonusPilis={};
      if(mission.effect==='cursed'&&mission.cursed){
        const hasCursed=Object.values(newTrick).some(c=>!c.isJoker&&mission.cursed.includes(c.value));
        if(hasCursed&&winnerId)bonusPilis[winnerId]=(bonusPilis[winnerId]||0)+1;
      }
      if(mission.effect==='first_last_cursed'){
        const histLen=Object.keys(trickHistory||{}).length;
        const isFirst=histLen===0;
        const isLast=newHand.length===0&&playerList.every(p=>p.id===actPid||(p.hand&&p.hand.length===0));
        if((isFirst||isLast)&&winnerId)bonusPilis[winnerId]=(bonusPilis[winnerId]||0)+1;
      }
      for(const[pid,b] of Object.entries(bonusPilis)){
        updates[`rooms/${roomCode}/players/${pid}/pilis`]=(players[pid].pilis||0)+b;
      }
      updates[`rooms/${roomCode}/players/${winnerId}/tricksWon`]=(players[winnerId].tricksWon||0)+1;
      const newHistory={...(trickHistory||{}),[Object.keys(trickHistory||{}).length]:newTrick};
      updates[`rooms/${roomCode}/trickHistory`]=newHistory;
      updates[`rooms/${roomCode}/currentTrick`]={};
      // Check if hands empty
      const updatedHands={};
      playerList.forEach(p=>{updatedHands[p.id]=p.id===actPid?newHand:p.hand;});
      const handsEmpty=Object.values(updatedHands).every(h=>!h||h.length===0);
      if(handsEmpty){
        // End of round
        for(const p of playerList){
          const tw=p.id===winnerId?(p.tricksWon||0)+1:p.id===actPid?(p.tricksWon||0)+1:p.tricksWon||0;
          const actualTw=updates[`rooms/${roomCode}/players/${p.id}/tricksWon`]??tw;
          const diff=Math.abs((p.bet??0)-actualTw);
          let gained=diff;
          if(mission.effect==='bet_success_minus_pili'&&diff===0)gained=-(p.bet??0);
          let newP=Math.max(0,(updates[`rooms/${roomCode}/players/${p.id}/pilis`]??p.pilis??0)+gained);
          // Designate
          if(mission.effect==='designate'&&p.designatedTarget){
            const tgt=players[p.designatedTarget];
            const tgtTw=updates[`rooms/${roomCode}/players/${p.designatedTarget}/tricksWon`]??tgt.tricksWon??0;
            const tgtDiff=Math.abs((tgt.bet??0)-tgtTw);
            newP=Math.max(0,newP+tgtDiff);
          }
          updates[`rooms/${roomCode}/players/${p.id}/pilis`]=newP;
        }
        updates[`rooms/${roomCode}/phase`]='results';
        updates[`rooms/${roomCode}/currentPlayer`]=null;
      } else {
        updates[`rooms/${roomCode}/currentPlayer`]=winnerId;
      }
    } else {
      const idx=playerList.findIndex(p=>p.id===actPid);
      updates[`rooms/${roomCode}/currentPlayer`]=playerList[(idx+1)%numPlayers].id;
    }
  }

  await db.ref().update(updates);
}

function getPostBetPhase(mission){
  if(mission.effect==='designate')return 'designate';
  return 'playing';
}

// ── AI ────────────────────────────────────────────────────────────────────
function handleAITurn(gs,aiId){
  const{phase,players,mission,currentTrick}=gs;
  const ai=players[aiId];
  const playerList=sortedPlayers(gs);
  const aiIdx=playerList.findIndex(p=>p.id===aiId);
  const reversed=mission.effect==='reversed'||mission.effect==='reversed_hidden';
  if(phase==='betting'||phase==='bet_before_see'){
    const existing=playerList.slice(0,aiIdx).map(p=>p.bet??0);
    let est=ai.hand.filter(c=>effectiveVal(c,reversed)>(reversed?28:28)).length;
    if(ai.hand.some(c=>c.isJoker))est=Math.max(est,Math.floor(ai.hand.length*0.6));
    est=Math.max(0,Math.min(est,ai.hand.length));
    if(aiIdx===playerList.length-1){
      const s=existing.reduce((a,b)=>a+b,0);
      if(s+est===mission.cards)est=est>0?est-1:est+1;
    }
    if(mission.effect==='no_bet_0'&&est===0)est=1;
    if(mission.effect==='no_bet_1'&&est===1)est=2;
    processAction(aiId,{type:'place_bet',bet:Math.max(0,Math.min(est,ai.hand.length))});
  } else if(phase==='playing'){
    const tCards=Object.values(currentTrick||{});
    const sorted=[...ai.hand].sort((a,b)=>effectiveVal(a,reversed)-effectiveVal(b,reversed));
    let card;
    if(tCards.length===0){card=sorted[Math.floor(sorted.length/2)];}
    else{
      const maxP=Math.max(...tCards.map(c=>effectiveVal(c,reversed)));
      const winners=sorted.filter(c=>effectiveVal(c,reversed)>maxP);
      card=winners.length>0?winners[0]:sorted[sorted.length-1];
    }
    if(!card)return;
    processAction(aiId,{type:'play_card',cardId:card.id,value:card.isJoker?28:card.value,isJoker:card.isJoker});
  } else if(phase==='three_of_five_select'){
    processAction(aiId,{type:'select_three',cards:ai.hand.slice(0,3).map(c=>c.id)});
  } else if(phase==='designate'){
    const others=playerList.filter(p=>p.id!==aiId);
    if(others.length>0)processAction(aiId,{type:'designate_player',targetId:others[0].id});
  }
}

// Init
window._currentBet=0;
_liveBet=0;
</script>
